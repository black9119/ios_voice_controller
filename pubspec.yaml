name: ios_voice_controller
description: "iOS Voice Controller Zego Call"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.3.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  # 锁定支持iOS12的Zego版本
  zego_express_engine: ^3.12.0
  # 锁定最后支持iOS12的audioplayers版本，5.x起要求更高iOS版本
  audioplayers: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
