name: Build iOS Dual IPAs
on:
  workflow_dispatch:

jobs:
  build:
    name: Build IPA for ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # A端 最低iOS12
          - target: "A-iOS12"
            deployment_target: "12.0"
          # B端 最低iOS15，适配iOS18设备
          - target: "B-iOS15"
            deployment_target: "15.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Pod cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
          key: ${{ matrix.target }}-pod-${{ hashFiles('ios/Podfile','pubspec.yaml') }}

      - name: Clean old pods
        run: |
          cd ios
          pod deintegrate || true
          rm -rf Pods Podfile.lock

      - name: Build unsigned IPA
        run: |
          flutter build ipa --release \
            --no-codesign \
            --extra-build-args "IPHONEOS_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA-${{ matrix.target }}
          path: build/ios/ipa/*.ipa
