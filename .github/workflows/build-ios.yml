name: Manual Build Unsigned IPA iOS12

on:
  workflow_dispatch:

jobs:
  build:
    # 固定 macOS 14 + Xcode 15.4：Flutter 3.19.6 的官方支持组合
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Setup Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      # Podfile 依赖这个变量定位 podhelper，显式导出，别靠隐式注入
      - name: Export FLUTTER_ROOT
        run: echo "FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))" >> $GITHUB_ENV

      - name: Flutter clean
        run: flutter clean

      - name: Delete pubspec.lock
        run: rm -f pubspec.lock

      - name: Flutter pub get
        run: flutter pub get

      - name: Pod clean & install
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update

      # 先生成 ios/Flutter/Generated.xcconfig 并提前暴露 Dart 编译错误
      - name: Flutter build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Xcode archive (no sign)
        run: |
          cd ios
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Build unsigned IPA
        run: |
          cd ios
          APP_PATH="build/Runner.xcarchive/Products/Applications/Runner.app"
          if [ -d "$APP_PATH" ]; then
            echo "✅ 找到 Runner.app"
            rm -rf Payload
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -q -r Runner.ipa Payload
            mv Runner.ipa build/
            ls -la build/
          else
            echo "❌ 找不到 Runner.app，archive 失败"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa-ios12
          path: ios/build/Runner.ipa
