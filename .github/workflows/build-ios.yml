name: Manual Build Unsigned IPA iOS12

on:
  workflow_dispatch:

jobs:
  build:
    # macos-14 镜像已被 GitHub 下线，改用 macos-15（arm64）
    # 不自选 Xcode：镜像默认的 Xcode 才带完整的 iOS 平台，切换到旧版会报 “iOS 18.2 未安装”
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show selected Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Setup Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      # Podfile 依赖这个变量定位 podhelper，显式导出，别靠隐式注入
      - name: Export FLUTTER_ROOT
        run: echo "FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))" >> $GITHUB_ENV

      - name: Flutter clean
        run: flutter clean

      - name: Delete pubspec.lock
        run: rm -f pubspec.lock

      - name: Flutter pub get
        run: flutter pub get

      - name: Pod clean & install
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update

      # 只生成 ios/Flutter/Generated.xcconfig，不真正调用 xcodebuild
      # （直接 flutter build ios 会因未配置 Development Team 而失败，实际编译交给下面的 archive）
      - name: Generate iOS build config
        run: flutter build ios --release --no-codesign --config-only

      - name: Xcode archive (no sign)
        run: |
          cd ios
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Build unsigned IPA
        run: |
          cd ios
          APP_PATH="build/Runner.xcarchive/Products/Applications/Runner.app"
          if [ -d "$APP_PATH" ]; then
            echo "✅ 找到 Runner.app"
            rm -rf Payload
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -q -r Runner.ipa Payload
            mv Runner.ipa build/
            ls -la build/
          else
            echo "❌ 找不到 Runner.app，archive 失败"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa-ios12
          path: ios/build/Runner.ipa
