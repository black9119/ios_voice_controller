name: Manual Build Unsigned IPA
on:
  workflow_dispatch: # 只在GitHub仓库页面，Actions里面手动点按钮启动
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable

      - name: Flutter clean
        run: flutter clean

      - name: Delete pubspec.lock
        run: rm -f pubspec.lock

      - name: Flutter pub get
        run: flutter pub get

      - name: Pod clean & install (iOS12 compatible)
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Xcode archive (no sign)
        run: |
          cd ios
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA
        run: |
          cd ios
          rm -rf Payload
          mkdir -p Payload
          APP_PATH="build/Runner.xcarchive/Products/Applications/Runner.app"
          if [ -d "$APP_PATH" ];then
            echo "✅ 找到Runner.app，开始打包IPA"
            cp -R "$APP_PATH" Payload/
            zip -q -r Runner.ipa Payload
            mv Runner.ipa build/
            ls -la build/
          else
            echo "❌ 找不到Runner.app，archive失败"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: ios/build/Runner.ipa
